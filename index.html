<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poke Run</title>
<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;
  background:url(assets/tex/TEX_SkyboxGradientBlueWithSand_A_000_Ti.png) center/100% 100% no-repeat #4aa8f5}
canvas{display:block}
#hud{position:fixed;top:12px;left:0;right:0;text-align:center;color:#fff;font-size:20px;font-weight:700;text-shadow:0 2px 4px #0008;pointer-events:none}
#msg{position:fixed;top:28%;left:0;right:0;text-align:center;color:#fff;font-size:84px;font-weight:900;text-shadow:0 5px 10px #0009;-webkit-text-stroke:2px #1b3a73;pointer-events:none}
#msg small{display:block;font-size:24px;font-weight:600;-webkit-text-stroke:0}
#help{position:fixed;bottom:10px;left:12px;color:#fff;font-size:13px;text-shadow:0 1px 3px #000a;pointer-events:none}
#spec{position:fixed;bottom:56px;left:0;right:0;text-align:center;color:#fff;display:none;text-shadow:0 3px 6px #000a;pointer-events:none}
#spec b{display:block;font-size:34px;font-weight:900;letter-spacing:1px;-webkit-text-stroke:1.5px #1b3a73}
#spec span{display:block;font-size:24px;font-weight:700;color:#ffe135;min-height:30px}
#spec small{display:block;font-size:17px;font-weight:600;opacity:.95}
kbd{display:inline-block;min-width:24px;padding:1px 6px;margin:0 2px;border-radius:6px;background:#ffffffee;color:#1b3a73;font-weight:800}
#specTime{position:fixed;top:44px;right:18px;color:#fff;text-align:center;display:none;text-shadow:0 2px 5px #000a;font-weight:700;font-size:16px;background:#1b3a7388;border-radius:12px;padding:6px 14px}
#specTime b{display:block;font-size:34px}
/* practice menu */
#menu{position:fixed;left:50%;top:44%;transform:translate(-50%,0);width:520px;max-width:92vw;max-height:48vh;overflow:auto;background:#1b3a73cc;border-radius:16px;padding:10px 12px;color:#fff;display:none;box-shadow:0 8px 30px #0008}
#menu .item{padding:7px 12px;border-radius:10px;font-weight:700;font-size:19px;cursor:pointer;display:flex;gap:12px;align-items:center}
#menu .item span{display:inline-block;width:22px;text-align:center;background:#ffffff33;border-radius:6px}
#menu .item em{margin-left:auto;font-size:13px;font-weight:600;opacity:.75}
#menu .item.sel,#menu .item:hover{background:#ffe135;color:#1b3a73}
#menu .hint{font-size:13px;opacity:.8;text-align:center;margin-top:6px}
/* home screen */
#home{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);width:760px;max-width:94vw;background:#1b3a73d9;border-radius:18px;padding:14px 18px 16px;color:#fff;text-align:center;box-shadow:0 10px 36px #0009}
#home h1{margin:0 0 8px;font-size:40px;font-weight:900;letter-spacing:2px;-webkit-text-stroke:1.5px #0d2250;text-shadow:0 4px 8px #0008}
#nameIn{width:260px;font-size:20px;font-weight:700;padding:8px 12px;border-radius:10px;border:3px solid #ffe135;text-align:center;outline:none}
#picker{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:12px 0}
#picker button{padding:8px 2px;border-radius:9px;border:2px solid #ffffff55;background:#ffffff1f;color:#fff;font-weight:700;font-size:13px;cursor:pointer}
#picker button.sel,#picker button:hover{background:#ffe135;color:#1b3a73;border-color:#fff}
#home .row{display:flex;gap:12px;justify-content:center}
#home button.big{font-size:26px;font-weight:900;padding:10px 46px;border-radius:14px;border:0;cursor:pointer;background:#34d058;color:#fff;box-shadow:0 5px 0 #1c8a37}
#home button.alt{font-size:16px;font-weight:700;padding:10px 20px;border-radius:14px;border:2px solid #ffffff88;cursor:pointer;background:transparent;color:#fff}
#home .tip{font-size:13px;opacity:.8;margin-top:8px}
/* results */
#results{position:fixed;left:50%;top:9%;transform:translateX(-50%);width:480px;max-width:92vw;max-height:78vh;overflow:auto;background:#1b3a73e6;border-radius:16px;padding:12px 16px;color:#fff;display:none;box-shadow:0 10px 36px #0009}
#results h2{margin:0 0 8px;text-align:center;font-size:28px;font-weight:900;letter-spacing:1px}
#results table{width:100%;border-collapse:collapse;font-size:17px;font-weight:600}
#results td{padding:3px 8px}
#results td:first-child{width:36px;text-align:center;font-weight:900}
#results td:last-child{text-align:right;opacity:.85}
#results tr.q{background:#34d05833}
#results tr.you{background:#ffe135;color:#1b3a73}
#results .next{margin:0 0 8px;text-align:center;font-size:18px;font-weight:800;color:#ffe135}
/* poderes + HUD */
#item{position:fixed;left:22px;bottom:58px;display:none;align-items:center;gap:12px;padding:10px 16px 10px 12px;border-radius:18px;background:linear-gradient(135deg,#2a1055e6,#12073aE6);border:3px solid var(--c,#fff);box-shadow:0 0 22px var(--c,#fff),inset 0 0 14px #ffffff22;color:#fff;pointer-events:none}
#item .ico{font-size:44px;line-height:1;filter:drop-shadow(0 0 8px var(--c,#fff))}
#item .txt b{display:block;font-size:18px;font-weight:900;letter-spacing:1px;color:var(--c,#fff);text-shadow:0 0 8px var(--c,#fff)}
#item .txt small{display:block;font-size:13px;opacity:.9;max-width:190px}
#item .key{margin-left:6px;width:34px;height:34px;border-radius:9px;background:#fff;color:#2a1055;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #0006}
#item.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
#toast{position:fixed;top:19%;left:0;right:0;text-align:center;font-size:40px;font-weight:900;opacity:0;pointer-events:none;-webkit-text-stroke:2px #1a0d2e;text-shadow:0 4px 12px #000a,0 0 22px currentColor;letter-spacing:1px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen}
#prog{position:fixed;top:8px;left:50%;transform:translateX(-50%);width:min(560px,60vw);height:12px;border-radius:8px;background:#1a0d2e99;border:2px solid #ffffff55;display:none;pointer-events:none;box-shadow:0 0 12px #b86bff88}
#prog i{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;border:1px solid #1a0d2e;box-shadow:0 0 6px currentColor}
#prog i.me{width:16px;height:16px;margin:-8px 0 0 -8px;border:3px solid #fff;z-index:2;box-shadow:0 0 12px #fff}
#hud{top:26px;text-shadow:0 2px 6px #1a0d2ecc,0 0 14px #b86bff88}
#home,#results,#menu{background:linear-gradient(160deg,#3b1480ee,#16084aee);border:2px solid #ff8ae255;box-shadow:0 10px 40px #000a,0 0 30px #b86bff55}
#home h1{background:linear-gradient(90deg,#ffe135,#ff4fa3,#4fe3ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;filter:drop-shadow(0 3px 0 #1a0d2e) drop-shadow(0 0 14px #ff4fa388)}
#home button.big{background:linear-gradient(180deg,#5dff7a,#1fc24a);box-shadow:0 5px 0 #0f7a2b,0 0 18px #5dff7a88}
#picker{gap:8px}
#picker button.card{padding:0;aspect-ratio:1;border-radius:12px;border:3px solid #ffffff44;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 35%,hsl(var(--h),90%,62%),hsl(var(--h),80%,28%));transition:transform .12s,box-shadow .12s}
#picker button.card img{width:100%;height:100%;display:block;pointer-events:none}
#picker button.card:hover{transform:translateY(-3px) scale(1.05);border-color:#fff}
#picker button.card.sel{border-color:#ffe135;transform:scale(1.1);z-index:2;box-shadow:0 0 0 2px #1a0d2e,0 0 20px #ffe135,0 0 34px #ff4fa3aa}
#picker button.card:not(.sel){filter:saturate(.75) brightness(.85)}
</style></head><body>
<div id="hud"></div><div id="msg"></div><div id="prog"></div><div id="item"></div><div id="toast"></div><div id="flash"></div>
<div id="menu"></div><div id="spec"></div><div id="specTime"></div><div id="results"></div>
<div id="home">
  <h1>POKE RUN</h1>
  <input id="nameIn" maxlength="14" placeholder="Your name" autocomplete="off">
  <div id="picker"></div>
  <div class="row"><button id="playBtn" class="big">PLAY</button><button id="practiceBtn" class="alt">Practice (offline)</button></div>
  <div class="tip">Pick your character (← → keys work too) · online races with up to 16 players, bots fill empty spots</div>
</div>
<div id="help">WASD move · Space jump · Shift/E dive · F use power · V effects · drag mouse / Q-Z rotate camera · R restart (practice) · N/B next/prev (practice) · M menu</div>
<script type="module" src="main.js"></script>
</body></html>
